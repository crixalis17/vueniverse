name: why_pulse
description: A private, evidence-first health timeline and personal experiment app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.6 <3.45.0'

dependencies:
  crypto: ^3.0.7
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  shared_preferences: ^2.5.4
  sqlite3: ^3.4.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.0
  pigeon: ^27.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/demo/

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
